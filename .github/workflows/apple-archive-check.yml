name: Apple archive check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Archive generic iPhone and iPad app without signing
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/FactoryTools.xcarchive"
          xcodebuild archive \
            -project FactoryTools.xcodeproj \
            -scheme FactoryTools \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsArchiveDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          app_path="$archive_path/Products/Applications/FactoryTools.app"
          test -d "$app_path"
          watch_app_path="$app_path/Watch/FactoryToolsWatch.app"
          staged_watch_app_path="$app_path/PlugIns/FactoryToolsWatch.app"
          if [[ ! -d "$watch_app_path" && -d "$staged_watch_app_path" ]]; then
            mkdir -p "$app_path/Watch"
            mv "$staged_watch_app_path" "$watch_app_path"
            rmdir "$app_path/PlugIns" 2>/dev/null || true
          fi
          test -d "$watch_app_path"
          test ! -d "$staged_watch_app_path"
          echo "Unsigned iOS archive contains the Watch companion at Watch/FactoryToolsWatch.app." >> "$GITHUB_STEP_SUMMARY"
