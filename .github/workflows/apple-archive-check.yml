name: Apple archive check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Archive generic iPhone and iPad app without signing
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/FactoryTools.xcarchive"
          xcodebuild archive \
            -project FactoryTools.xcodeproj \
            -scheme FactoryTools \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsArchiveDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          app_path="$archive_path/Products/Applications/FactoryTools.app"
          test -d "$app_path"
          test -d "$app_path/PlugIns/FactoryToolsWatch.app"
          echo "Unsigned iOS archive contains the Watch companion at PlugIns/FactoryToolsWatch.app." >> "$GITHUB_STEP_SUMMARY"
