name: Apple native checks

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      enable_private_macos_runner:
        description: Confirm FACTORYTOOLS_PRIVATE_MACOS_CI is enabled only after a no-overage billing guard is verified.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    # Public repositories use standard macOS runners at no charge. For private repositories,
    # require a manual run and an explicit confirmation that overage is blocked.
    if: github.event.repository.visibility == 'public' || (github.event_name == 'workflow_dispatch' && inputs.enable_private_macos_runner == true && vars.FACTORYTOOLS_PRIVATE_MACOS_CI == 'enabled')
    # Xcode 16.4 on macOS 15 Intel crashed in the app-hosted StoreKit test with SIGSEGV.
    # Reuse the previously successful macOS 26 / Xcode 26.6 arm64 runner for StoreKitTest.
    runs-on: macos-26-arm64
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Run source-level checks
        run: |
          python3 -B -m unittest discover -s Scripts -p 'test_*.py'
          python3 Scripts/validate_static.py
          python3 Scripts/audit_source_hygiene.py
          python3 Scripts/generate_public_site.py --check

      - name: Test iPhone and app-hosted regression suite
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")), ""))')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone Simulator device was found." >&2
            exit 1
          fi
          result_bundle="$RUNNER_TEMP/FactoryTools-iPhone.xcresult"
          xcode_log="$RUNNER_TEMP/FactoryTools-iPhone-xcodebuild.log"
          test_status=0
          set +e
          xcodebuild test \
            -project FactoryTools.xcodeproj \
            -scheme FactoryTools \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData" \
            -resultBundlePath "$result_bundle" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$xcode_log"
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            {
              echo "## iPhone XCTest failure diagnostics"
              echo
              echo "xcodebuild exited with status $test_status on simulator $simulator_id."
              if [[ -d "$result_bundle" ]]; then
                echo
                echo "### xcresult summary"
                echo '```json'
                if ! xcrun xcresulttool get test-results summary --path "$result_bundle"; then
                  echo "xcresulttool could not summarize the result bundle."
                fi
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$test_status"
          fi

      - name: Upload iPhone XCTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-tools-iphone-xctest-diagnostics
          path: |
            ${{ runner.temp }}/FactoryTools-iPhone.xcresult
            ${{ runner.temp }}/FactoryTools-iPhone-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture bilingual iPhone product-page screenshots from Release Simulator build
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")), ""))')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone Simulator device was found for screenshot capture." >&2
            exit 1
          fi
          xcodebuild build \
            -project FactoryTools.xcodeproj \
            -scheme FactoryTools \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          app_path="$RUNNER_TEMP/FactoryToolsDerivedData/Build/Products/Release-iphonesimulator/FactoryTools.app"
          test -d "$app_path"
          python3 Scripts/capture_simulator_screenshots.py \
            --device-id "$simulator_id" \
            --app "$app_path" \
            --output-dir "$RUNNER_TEMP/FactoryToolsAppStoreScreenshots" \
            --scenarios home cycle-time takt-time defect-counter counter-history

      - name: Upload bilingual iPhone screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-tools-app-store-iphone-product-page
          path: ${{ runner.temp }}/FactoryToolsAppStoreScreenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Capture bilingual 13-inch iPad home screenshots from Release Simulator build
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and "13-inch" in device["name"] and device["name"].startswith("iPad")), ""))')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available 13-inch iPad Simulator device was found." >&2
            exit 1
          fi
          app_path="$RUNNER_TEMP/FactoryToolsDerivedData/Build/Products/Release-iphonesimulator/FactoryTools.app"
          test -d "$app_path"
          python3 Scripts/capture_simulator_screenshots.py \
            --device-id "$simulator_id" \
            --app "$app_path" \
            --output-dir "$RUNNER_TEMP/FactoryToolsAppStoreiPadScreenshots" \
            --platform ipad

      - name: Upload bilingual 13-inch iPad screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-tools-app-store-ipad-home
          path: ${{ runner.temp }}/FactoryToolsAppStoreiPadScreenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Test iPad and app-hosted regression suite
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPad")), ""))')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPad Simulator device was found." >&2
            exit 1
          fi
          result_bundle="$RUNNER_TEMP/FactoryTools-iPad.xcresult"
          xcode_log="$RUNNER_TEMP/FactoryTools-iPad-xcodebuild.log"
          test_status=0
          set +e
          xcodebuild test \
            -project FactoryTools.xcodeproj \
            -scheme FactoryTools \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData" \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$xcode_log"
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            {
              echo "## iPad XCTest failure diagnostics"
              echo
              echo "xcodebuild exited with status $test_status on simulator $simulator_id."
              if [[ -d "$result_bundle" ]]; then
                echo
                echo "### xcresult summary"
                echo '```json'
                if ! xcrun xcresulttool get test-results summary --path "$result_bundle"; then
                  echo "xcresulttool could not read the result bundle; see the xcodebuild log excerpt below."
                fi
                echo '```'
              fi
              echo
              echo "### Failure-related build output"
              echo '```text'
              if ! grep -E -i 'error:|failed|failure|test case.*(failed|errored)' "$xcode_log" | tail -n 80; then
                tail -n 80 "$xcode_log"
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$test_status"

      - name: Test shared Core contracts
        run: >-
          xcodebuild test
          -project FactoryTools.xcodeproj
          -scheme FactoryToolsCore
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Build Watch Simulator target
        run: >-
          xcodebuild build
          -project FactoryTools.xcodeproj
          -scheme FactoryToolsWatch
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Build Watch Release Simulator target for screenshots
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and "46mm" in device["name"] and device["name"].startswith("Apple Watch")), ""))')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available 46mm Apple Watch Simulator device was found." >&2
            exit 1
          fi
          xcodebuild build \
            -project FactoryTools.xcodeproj \
            -scheme FactoryToolsWatch \
            -configuration Release \
            -destination "platform=watchOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp=YES
          app_path="$RUNNER_TEMP/FactoryToolsDerivedData/Build/Products/Release-watchsimulator/FactoryToolsWatch.app"
          test -d "$app_path"

      - name: Capture bilingual Apple Watch screenshots from Release Simulator build
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and "46mm" in device["name"] and device["name"].startswith("Apple Watch")), ""))')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available 46mm Apple Watch Simulator device was found." >&2
            exit 1
          fi
          app_path="$RUNNER_TEMP/FactoryToolsDerivedData/Build/Products/Release-watchsimulator/FactoryToolsWatch.app"
          test -d "$app_path"
          python3 Scripts/capture_watch_screenshots.py \
            --device-id "$simulator_id" \
            --app "$app_path" \
            --output-dir "$RUNNER_TEMP/FactoryToolsWatchScreenshots"

      - name: Upload bilingual Apple Watch screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-tools-app-store-watch-home
          path: ${{ runner.temp }}/FactoryToolsWatchScreenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Archive generic iPhone and iPad app without signing
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/FactoryTools.xcarchive"
          xcodebuild archive \
            -project FactoryTools.xcodeproj \
            -scheme FactoryTools \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsArchiveDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          test -d "$archive_path/Products/Applications/FactoryTools.app"
          test -d "$archive_path/Products/Applications/FactoryTools.app/PlugIns/FactoryToolsWatch.app"
