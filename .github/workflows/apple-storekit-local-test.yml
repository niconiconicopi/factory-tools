name: Apple local StoreKit purchase test

on:
  workflow_dispatch:
    inputs:
      enable_private_macos_runner:
        description: Confirm FACTORYTOOLS_PRIVATE_MACOS_CI is enabled only after a no-overage billing guard is verified.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  storekit:
    if: github.event.repository.visibility == 'public' || (inputs.enable_private_macos_runner == true && vars.FACTORYTOOLS_PRIVATE_MACOS_CI == 'enabled')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.5 for the StoreKit runtime comparison
        shell: bash
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_26.5.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "The macOS 26 image does not contain the expected Xcode 26.5 installation." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version | tee "$RUNNER_TEMP/FactoryTools-StoreKit-toolchain.txt"
          DEVELOPER_DIR="$developer_dir" xcrun simctl list runtimes | tee "$RUNNER_TEMP/FactoryTools-StoreKit-runtimes.txt"

      - name: Run the local StoreKit purchase integration test
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json
          import re
          import sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if match is None:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              candidates.extend((version, device["udid"]) for device in devices if device["isAvailable"] and device["name"].startswith("iPhone"))
          preferred = [candidate for candidate in candidates if candidate[0] == (26, 2)]
          selected = max(preferred or candidates) if candidates else None
          print(selected[1] if selected else "")
          ')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone Simulator device was found." >&2
            exit 1
          fi
          printf '%s\n' "$simulator_id" > "$RUNNER_TEMP/FactoryTools-StoreKit-simulator-id.txt"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/FactoryTools-StoreKit-devices.json"
          result_bundle="$RUNNER_TEMP/FactoryTools-StoreKit.xcresult"
          xcode_log="$RUNNER_TEMP/FactoryTools-StoreKit-xcodebuild.log"
          test_status=0
          set +e
          xcodebuild test \
            -project FactoryTools.xcodeproj \
            -scheme FactoryToolsStoreKit \
            -testPlan FactoryToolsStoreKit \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsStoreKitDerivedData" \
            -resultBundlePath "$result_bundle" \
            -parallel-testing-enabled NO \
            -only-testing:FactoryToolsTests/ProPurchaseManagerTests/testLocalLifetimePurchaseUnlocksAndClearingTransactionsRevokesPro \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- 2>&1 | tee "$xcode_log"
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            xcrun simctl spawn "$simulator_id" log show \
              --last 10m \
              --style compact \
              --predicate '(process == "storekitd") OR (process == "appstored") OR (subsystem CONTAINS[c] "StoreKit")' \
              > "$RUNNER_TEMP/FactoryTools-StoreKit-simulator.log" 2>&1 || true
            {
              echo "## Local StoreKit integration diagnostics"
              echo
              echo "xcodebuild exited with status $test_status on simulator $simulator_id."
              if [[ -d "$result_bundle" ]]; then
                echo
                echo '```json'
                if ! xcrun xcresulttool get test-results summary --path "$result_bundle"; then
                  echo "xcresulttool could not summarize the result bundle."
                fi
                echo '```'
              fi
              echo
              echo '```text'
              if ! grep -E -i 'SKInternalErrorDomain|error:|failed|failure|test case.*(failed|errored)' "$xcode_log" | tail -n 80; then
                tail -n 80 "$xcode_log"
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$test_status"
          fi

      - name: Upload StoreKit integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: factory-tools-storekit-integration-diagnostics
          path: |
            ${{ runner.temp }}/FactoryTools-StoreKit.xcresult
            ${{ runner.temp }}/FactoryTools-StoreKit-xcodebuild.log
            ${{ runner.temp }}/FactoryTools-StoreKit-toolchain.txt
            ${{ runner.temp }}/FactoryTools-StoreKit-runtimes.txt
            ${{ runner.temp }}/FactoryTools-StoreKit-devices.json
            ${{ runner.temp }}/FactoryTools-StoreKit-simulator-id.txt
            ${{ runner.temp }}/FactoryTools-StoreKit-simulator.log
          if-no-files-found: ignore
          retention-days: 7
