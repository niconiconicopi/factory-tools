name: Apple Watch and archive checks

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      enable_private_macos_runner:
        description: Confirm FACTORYTOOLS_PRIVATE_MACOS_CI is enabled only after a no-overage billing guard is verified.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watch:
    if: github.event.repository.visibility == 'public' || (github.event_name == 'workflow_dispatch' && inputs.enable_private_macos_runner == true && vars.FACTORYTOOLS_PRIVATE_MACOS_CI == 'enabled')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Test shared Core contracts
        run: >-
          xcodebuild test
          -project FactoryTools.xcodeproj
          -scheme FactoryToolsCore
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Build Watch Simulator target
        run: >-
          xcodebuild build
          -project FactoryTools.xcodeproj
          -scheme FactoryToolsWatch
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData"
          CODE_SIGNING_ALLOWED=NO

      - name: Build Watch Release Simulator target for screenshots
        id: build_watch_release
        shell: bash
        run: |
          set -euo pipefail
          simulator_info="$(python3 -c 'import json,subprocess; result=subprocess.run(["xcrun", "simctl", "list", "devices", "available", "--json"], check=True, capture_output=True, text=True, timeout=30); data=json.loads(result.stdout); device=next((device for devices in data["devices"].values() for device in devices if device["isAvailable"] and "46mm" in device["name"] and device["name"].startswith("Apple Watch")), None); print((device["udid"] + "|" + device["name"]) if device else "")')"
          IFS='|' read -r simulator_id simulator_name <<< "$simulator_info"
          if [[ -z "$simulator_id" || -z "$simulator_name" ]]; then
            echo "No available 46mm Apple Watch Simulator device was found." >&2
            exit 1
          fi
          xcodebuild build \
            -project FactoryTools.xcodeproj \
            -scheme FactoryToolsWatch \
            -configuration Release \
            -destination "platform=watchOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp=YES
          app_path="$RUNNER_TEMP/FactoryToolsDerivedData/Build/Products/Release-watchsimulator/FactoryToolsWatch.app"
          test -d "$app_path"
          echo "simulator_id=$simulator_id" >> "$GITHUB_OUTPUT"
          echo "simulator_name=$simulator_name" >> "$GITHUB_OUTPUT"

      - name: Capture bilingual Apple Watch screenshots from Release Simulator build
        id: capture_watch_screenshots
        timeout-minutes: 30
        continue-on-error: true
        shell: bash
        env:
          WATCH_SIMULATOR_ID: ${{ steps.build_watch_release.outputs.simulator_id }}
          WATCH_SIMULATOR_NAME: ${{ steps.build_watch_release.outputs.simulator_name }}
        run: |
          set -euo pipefail
          simulator_id="$WATCH_SIMULATOR_ID"
          simulator_name="$WATCH_SIMULATOR_NAME"
          if [[ -z "$simulator_id" || -z "$simulator_name" ]]; then
            echo "The selected Watch Simulator identity was not preserved from the Release build." >&2
            exit 1
          fi
          app_path="$RUNNER_TEMP/FactoryToolsDerivedData/Build/Products/Release-watchsimulator/FactoryToolsWatch.app"
          test -d "$app_path"
          python3 Scripts/capture_watch_screenshots.py \
            --device-id "$simulator_id" \
            --device-name "$simulator_name" \
            --app "$app_path" \
            --output-dir "$RUNNER_TEMP/FactoryToolsWatchScreenshots"

      - name: Upload bilingual Apple Watch screenshot artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: factory-tools-app-store-watch-home
          path: ${{ runner.temp }}/FactoryToolsWatchScreenshots/
          if-no-files-found: ignore
          retention-days: 30

  archive:
    if: github.event.repository.visibility == 'public' || (github.event_name == 'workflow_dispatch' && inputs.enable_private_macos_runner == true && vars.FACTORYTOOLS_PRIVATE_MACOS_CI == 'enabled')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Archive generic iPhone and iPad app without signing
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/FactoryTools.xcarchive"
          xcodebuild archive \
            -project FactoryTools.xcodeproj \
            -scheme FactoryTools \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/FactoryToolsArchiveDerivedData" \
            CODE_SIGNING_ALLOWED=NO
          app_path="$archive_path/Products/Applications/FactoryTools.app"
          test -d "$app_path"
          test -d "$archive_path/Products/Applications/FactoryTools.app/PlugIns/FactoryToolsWatch.app"
          echo "Unsigned iOS archive contains the Watch companion at PlugIns/FactoryToolsWatch.app." >> "$GITHUB_STEP_SUMMARY"
